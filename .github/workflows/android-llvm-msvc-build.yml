name: android-llvm-msvc-build

permissions:
  contents: write

on: [push, pull_request]

jobs:
  build:
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    env:
      BUILD_TYPE: Release
      TARGET_TRIPLE: aarch64-linux-gnu

    steps:
      - name: Setup build deps
        run: |
          set -euxo pipefail
          sudo apt-get update

          # Host build deps
          sudo apt-get install -y \
            build-essential cmake ninja-build git python3 \
            p7zip-full p7zip-rar

          # Cross toolchain + sysroot for aarch64-linux-gnu
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross linux-libc-dev-arm64-cross

          # Some common deps LLVM may probe for (safe to have)
          sudo apt-get install -y \
            zlib1g-dev libzstd-dev libtinfo-dev

          cmake --version
          ninja --version
          aarch64-linux-gnu-gcc --version

      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          path: llvm-msvc
          submodules: recursive

      - name: Build LLVM (host clang/lld)
        run: |
          set -euxo pipefail

          # 你原来那条 sed 我保留（如果你的代码确实需要）
          find llvm-msvc/llvm -type f -exec sed -i 's/#include <vcruntime_string\.h>/\/\/ #include <vcruntime_string.h>/g' {} + || true

          cmake -GNinja -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX="$PWD/install" \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="X86;ARM;AArch64;RISCV" \
            llvm-msvc/llvm

          cmake --build build --config ${{ env.BUILD_TYPE }}
          cmake --build build --config ${{ env.BUILD_TYPE }} --target install

          "$PWD/install/bin/clang" --version
          "$PWD/install/bin/ld.lld" --version

      - name: Detect aarch64 sysroot
        run: |
          set -euxo pipefail
          # Ubuntu cross sysroot 常见位置
          if [ -d "/usr/aarch64-linux-gnu" ]; then
            echo "SYSROOT=/usr/aarch64-linux-gnu" >> $GITHUB_ENV
          elif [ -d "/usr/${{ env.TARGET_TRIPLE }}" ]; then
            echo "SYSROOT=/usr/${{ env.TARGET_TRIPLE }}" >> $GITHUB_ENV
          else
            echo "Cannot find sysroot under /usr/aarch64-linux-gnu or /usr/${{ env.TARGET_TRIPLE }}"
            ls -lah /usr | head
            exit 1
          fi

      - name: Build runtimes (libcxx/libcxxabi/libunwind) for aarch64
        run: |
          set -euxo pipefail

          # 强烈建议用 libc++ 自己的“交叉编译”方式：指定 target + sysroot + 交叉 ar/nm/ranlib
          cmake -GNinja -B runtimes-build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX="$PWD/install" \
            -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi;libunwind" \
            -DCMAKE_C_COMPILER="$PWD/install/bin/clang" \
            -DCMAKE_CXX_COMPILER="$PWD/install/bin/clang++" \
            -DCMAKE_C_COMPILER_TARGET="${{ env.TARGET_TRIPLE }}" \
            -DCMAKE_CXX_COMPILER_TARGET="${{ env.TARGET_TRIPLE }}" \
            -DCMAKE_SYSROOT="${SYSROOT}" \
            -DCMAKE_AR="aarch64-linux-gnu-ar" \
            -DCMAKE_NM="aarch64-linux-gnu-nm" \
            -DCMAKE_RANLIB="aarch64-linux-gnu-ranlib" \
            -DCMAKE_EXE_LINKER_FLAGS="--sysroot=${SYSROOT} -fuse-ld=lld" \
            -DCMAKE_SHARED_LINKER_FLAGS="--sysroot=${SYSROOT} -fuse-ld=lld" \
            -DLIBCXX_INCLUDE_BENCHMARKS=OFF \
            -DLIBCXX_ENABLE_SHARED=OFF \
            -DLIBCXXABI_ENABLE_SHARED=OFF \
            llvm-msvc/runtimes

          cmake --build runtimes-build --config ${{ env.BUILD_TYPE }}
          cmake --build runtimes-build --config ${{ env.BUILD_TYPE }} --target install

      - name: Build compiler-rt for aarch64
        run: |
          set -euxo pipefail

          cmake -GNinja -B compiler-rt-build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX="$PWD/install" \
            -DCMAKE_C_COMPILER="$PWD/install/bin/clang" \
            -DCMAKE_CXX_COMPILER="$PWD/install/bin/clang++" \
            -DCMAKE_C_COMPILER_TARGET="${{ env.TARGET_TRIPLE }}" \
            -DCMAKE_CXX_COMPILER_TARGET="${{ env.TARGET_TRIPLE }}" \
            -DCMAKE_SYSROOT="${SYSROOT}" \
            -DCMAKE_AR="aarch64-linux-gnu-ar" \
            -DCMAKE_NM="aarch64-linux-gnu-nm" \
            -DCMAKE_RANLIB="aarch64-linux-gnu-ranlib" \
            -DLLVM_CONFIG_PATH="$PWD/install/bin/llvm-config" \
            -DCMAKE_EXE_LINKER_FLAGS="--sysroot=${SYSROOT} -fuse-ld=lld" \
            -DCMAKE_SHARED_LINKER_FLAGS="--sysroot=${SYSROOT} -fuse-ld=lld" \
            -DCOMPILER_RT_BUILD_BUILTINS=ON \
            -DCOMPILER_RT_BUILD_SANITIZERS=ON \
            -DCOMPILER_RT_BUILD_XRAY=ON \
            -DCOMPILER_RT_BUILD_PROFILE=ON \
            -DCOMPILER_RT_BUILD_MEMPROF=ON \
            -DCOMPILER_RT_BUILD_LIBFUZZER=OFF \
            -DCOMPILER_RT_DEFAULT_TARGET_ONLY=ON \
            llvm-msvc/compiler-rt

          cmake --build compiler-rt-build --config ${{ env.BUILD_TYPE }}
          cmake --build compiler-rt-build --config ${{ env.BUILD_TYPE }} --target install

      - name: Package
        run: |
          set -euxo pipefail
          ls -lah install
          7z a android-llvm-msvc.zip install
          test -f android-llvm-msvc.zip
          ls -lah android-llvm-msvc.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-llvm-msvc
          path: android-llvm-msvc.zip

      - name: Release
        uses: softprops/action-gh-release@v1
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') || contains(github.ref, '-pre') }}
          files: android-llvm-msvc.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
